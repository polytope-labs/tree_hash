[workspace]
members = [
    "tree_hash",
    "tree_hash_derive",
]
resolver = "2"

[workspace.package]
version = "0.12.1"
edition = "2021"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/sigp/tree_hash"
keywords = ["ethereum"]
categories = ["cryptography::cryptocurrencies"]

# TODO: Remove once ethereum_ssz is published.
[patch.crates-io]
ethereum_ssz = { git = "https://github.com/polytope-labs/ethereum_ssz", rev = "928df8a3ed99360bbc18c604e89bf319a9e33e55" }
ethereum_ssz_derive = { git = "https://github.com/polytope-labs/ethereum_ssz", rev = "928df8a3ed99360bbc18c604e89bf319a9e33e55" }
ethereum_serde_utils = { git = "https://github.com/polytope-labs/ethereum_serde_utils", rev = "6f4ab738574da2e3a0204bb6d2521c14faee5b32" }
ethereum_hashing = { git = "https://github.com/polytope-labs/ethereum_hashing", rev = "30d2638547ce44cac0cdea44db32e9247d227a4a" }
